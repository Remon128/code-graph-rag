services:
  memgraph:
    image: memgraph/memgraph-mage
    container_name: code-graph-memgraph-new
    ports:
      - "${MEMGRAPH_PORT:-7687}:7687"
      - "${MEMGRAPH_HTTP_PORT:-7444}:7444"
    volumes:
      - memgraph_data_new:/var/lib/memgraph
    environment:
      MEMGRAPH_LOG_LEVEL: WARNING
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  
  lab:
    image: memgraph/lab
    container_name: code-graph-lab
    ports:
      - "3001:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: 7687
    depends_on:
      memgraph:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: code-graph-backend
    ports:
      - "8001:8000"
    environment:
      MEMGRAPH_HOST: memgraph
      MEMGRAPH_PORT: 7687
      MEMGRAPH_BATCH_SIZE: ${MEMGRAPH_BATCH_SIZE:-1000}
      TARGET_REPO_PATH: /repo
      RUN_INDEXING: ${RUN_INDEXING:-false}
      CLEAN_DATABASE: ${CLEAN_DATABASE:-false}
      ORCHESTRATOR_PROVIDER: ${ORCHESTRATOR_PROVIDER:-groq}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-openai/gpt-oss-120b}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      CYPHER_PROVIDER: ${CYPHER_PROVIDER:-groq}
      CYPHER_MODEL: ${CYPHER_MODEL:-openai/gpt-oss-120b}
      CYPHER_API_KEY: ${CYPHER_API_KEY:-}
      SHELL_COMMAND_TIMEOUT: ${SHELL_COMMAND_TIMEOUT:-30}
    volumes:
      - ${HOST_REPO_PATH}:/repo
      - qdrant_data:/app/.qdrant_code_embeddings
    depends_on:
      memgraph:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: code-graph-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  memgraph_data_new:
  qdrant_data:
